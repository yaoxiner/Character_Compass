name: Build Linux desktop app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt X11 build library
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 xvfb libxtst6
      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt pyinstaller pillow
      - name: Make desktop icon
        run: python tools/make_icon.py
      - name: Check sprite cell isolation
        run: python -m unittest discover -s tests -p test_pet_assets.py -v
      - name: Smoke test native pet offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_pet.py
      - name: Check native mouse dragging on X11
        run: xvfb-run -a env PET_REAL_MOUSE=1 QT_QPA_PLATFORM=xcb python tests/smoke_pet.py
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name CharacterCompass --add-data "web:web" --add-data "vendor:vendor" desktop.py
      - name: Verify packaged runtime
        run: dist/CharacterCompass/CharacterCompass --check-package
      - name: Check packaged pet with native mouse events
        run: xvfb-run -a python tests/check_packaged_pet.py dist/CharacterCompass/CharacterCompass
      - name: Add desktop launcher installer
        run: |
          cp packaging/install-linux-desktop.sh dist/CharacterCompass/install-desktop.sh
          chmod +x dist/CharacterCompass/install-desktop.sh
      - name: Archive runnable folder with executable permissions
        run: tar -C dist -czf CharacterCompass-Linux-x86_64.tar.gz CharacterCompass
      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: CharacterCompass-Linux-x86_64
          path: CharacterCompass-Linux-x86_64.tar.gz
